$kind: http-request
method: GET
url: '{{base_url}}/api/v1/twins/Well-1/timeline?limit=20&category=production&category=repair'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 or unknown well', () => pm.expect([200, 404]).to.include(pm.response.code));
      if (pm.response.code === 200) pm.test('Timeline page contract', () => {
        const json = pm.response.json(); pm.expect(json.items).to.be.an('array'); pm.expect(json).to.have.property('next_cursor');
      });
