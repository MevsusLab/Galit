$kind: http-request
method: GET
url: '{{base_url}}/api/v1/twins/Well-1/snapshot'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 or unknown well', () => pm.expect([200, 404]).to.include(pm.response.code));
      if (pm.response.code === 200) pm.test('Snapshot is versioned', () => pm.expect(pm.response.json()).to.have.property('policy_version'));
